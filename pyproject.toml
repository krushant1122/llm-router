[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-router"
version = "0.1.0"
description = "Adaptive Local-First LLM Router"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "psutil>=6.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "google-genai>=2.25",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
edge = [
    "torch==2.14.1",
    "transformers==5.20.2",
    "sentence-transformers==6.2.0",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
]

[project.scripts]
router = "router.cli.main:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/router", "src/eval"]
